<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Configurações – Cadastro de Motorista</title>
  <style>
    /* Mesma paleta Breviis do painel lateral (sidepanel/style.css). */
    :root {
      color-scheme: light dark;
      --fundo: oklch(0.985 0.003 90);
      --texto: oklch(0.22 0.015 90);
      --cartao: oklch(1 0 0);
      --suave: oklch(0.955 0.005 90);
      --texto-suave: oklch(0.5 0.01 90);
      --borda: oklch(0.9 0.006 90);
      --borda-campo: oklch(0.66 0.01 90);
      --ouro: oklch(0.826 0.169 92.2);
      --ouro-hover: oklch(0.78 0.165 90);
      --sobre-ouro: oklch(0.2 0.02 90);
      --escuro: oklch(0.16 0.008 90);
      --sobre-escuro: oklch(0.93 0.004 90);
      --anel: oklch(0.55 0.13 92);
      --sucesso: oklch(0.45 0.12 155);
      --sombra: 0 1px 2px oklch(0 0 0 / 0.04), 0 4px 14px oklch(0.3 0.01 90 / 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: oklch(0.129 0.042 264.695);
        --texto: oklch(0.984 0.003 247.858);
        --cartao: oklch(0.208 0.042 265.755);
        --suave: oklch(0.279 0.041 260.031);
        --texto-suave: oklch(0.704 0.04 256.788);
        --borda: oklch(1 0 0 / 10%);
        --borda-campo: oklch(0.55 0.03 260);
        --ouro-hover: oklch(0.87 0.16 92);
        --escuro: oklch(0.208 0.042 265.755);
        --sobre-escuro: oklch(0.984 0.003 247.858);
        --anel: oklch(0.826 0.169 92.2);
        --sucesso: oklch(0.8 0.15 155);
        --sombra: 0 1px 2px oklch(0 0 0 / 0.3);
      }
    }
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--texto); background: var(--fundo); -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--anel); outline-offset: 2px; }
    .topo {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      background: var(--escuro); color: var(--sobre-escuro); border-bottom: 2px solid var(--ouro);
    }
    .marca {
      display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 10px;
      background: var(--ouro); color: var(--sobre-ouro);
    }
    .topo-texto { display: grid; line-height: 1.2; }
    .topo-empresa { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ouro); }
    h1 { margin: 0; font-size: 16px; }
    main {
      max-width: 480px; margin: 20px auto; padding: 16px;
      background: var(--cartao); border: 1px solid var(--borda); border-top: 3px solid var(--ouro);
      border-radius: 1rem; box-shadow: var(--sombra);
    }
    @media (max-width: 520px) { main { margin: 12px; } }
    label { display: grid; gap: 4px; margin-bottom: 14px; font-weight: 600; }
    input, select {
      width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-weight: 400; color: var(--texto);
      background: var(--cartao); border: 1px solid var(--borda-campo); border-radius: 10px;
    }
    input:focus-visible, select:focus-visible { outline-offset: 0; border-color: var(--anel); }
    small { color: var(--texto-suave); font-weight: 400; font-size: 12px; }
    button {
      min-height: 38px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer;
      background: var(--ouro); color: var(--sobre-ouro); border: 1px solid transparent; border-radius: 12px;
    }
    button:hover { background: var(--ouro-hover); }
    #status { min-height: 1.45em; margin: 10px 0 0; color: var(--sucesso); font-weight: 600; }
  </style>
</head>
<body>
  <header class="topo">
    <span class="marca" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>
    </span>
    <div class="topo-texto">
      <span class="topo-empresa">Breviis Transportes</span>
      <h1>Configurações</h1>
    </div>
  </header>
  <main>
    <label>Chave da API do Gemini
      <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
      <small>Use uma chave de projeto com cobrança ativada: no plano gratuito o Google pode usar os documentos enviados.</small>
    </label>
    <label>Nacionalidade padrão
      <input id="nacionalidade">
    </label>
    <label>Propriedade padrão
      <select id="propriedade"><option value="1">Da Casa</option><option value="2">Agregado</option><option value="3">Terceiro</option></select>
    </label>
    <button id="salvar">Salvar</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="main.bundle.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Configurações – Cadastro de Motorista</title>
  <style>
    /* Mesmo visual neutro do painel (sidepanel/style.css). */
    :root {
      color-scheme: light dark;
      --bg: #fafafa; --surface: #ffffff; --text: #18181b; --muted: #71717a;
      --border: #e4e4e7; --border-strong: #d4d4d8;
      --accent: #4f46e5; --accent-hover: #4338ca; --on-accent: #ffffff; --ok: #15803d;
      --focus: 0 0 0 3px rgb(79 70 229 / 0.25);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0d; --surface: #161618; --text: #f4f4f5; --muted: #a1a1aa;
        --border: #27272a; --border-strong: #3f3f46;
        --accent: #818cf8; --accent-hover: #a5b4fc; --on-accent: #0b0b0d; --ok: #4ade80;
        --focus: 0 0 0 3px rgb(129 140 248 / 0.35);
      }
    }
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
    main { max-width: 460px; margin: 40px auto; padding: 0 16px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
    .cartao { display: grid; gap: 14px; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 550; color: var(--muted); }
    input, select { width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; }
    input:focus, select:focus, button:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
    small { color: var(--muted); font-weight: 400; font-size: 12px; }
    button { justify-self: start; min-height: 36px; padding: 0 18px; font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    #status { min-height: 1.5em; margin: 0; color: var(--ok); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Configurações</h1>
    <div class="cartao">
      <label>Chave da API do Gemini
        <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
        <small>Use uma chave de projeto com cobrança ativada: no plano gratuito o Google pode usar os documentos enviados.</small>
      </label>
      <label>Nacionalidade padrão
        <input id="nacionalidade">
      </label>
      <label>Propriedade padrão
        <select id="propriedade"><option value="1">Da Casa</option><option value="2">Agregado</option><option value="3">Terceiro</option></select>
      </label>
      <button id="salvar">Salvar</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script type="module" src="main.bundle.js"></script>
</body>
</html>
